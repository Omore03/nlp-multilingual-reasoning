# VERIFIED direct Google synthetic smoke, 12 Nov 2026; settings frozen. Real pilot data/selectors pending.
data_kind: real
demo_path: data/processed/demo_pool.jsonl
dev_path: data/processed/dev.jsonl
output_path: results/pilot_raw.jsonl
conditions: [U-U-U, U-U-E, U-E-E, E-E-E]
strategies: [random, similarity]
shot_count: 2
seed: 42
selector: src.selection.select:select_examples
selector_version: pending-rayyan-version
verification_receipt: results/live_smoke/google_direct/model_verification.json
model:
  backend: google_ai_studio
  model_id: gemma-4-31b-it
  endpoint: https://generativelanguage.googleapis.com/v1beta/models/gemma-4-31b-it:generateContent
  credential_env: GOOGLE_API_KEY
  route: google-ai-studio-direct
  free_only: true
  max_requests_per_invocation: 40
  min_request_interval_seconds: 3.1
  decoding:
    temperature: 0
    top_p: 1
    max_tokens: 2048
    seed: 42
    thinking_level: minimal
  timeout_seconds: 120
  max_attempts: 3
  max_retry_wait_seconds: 30
